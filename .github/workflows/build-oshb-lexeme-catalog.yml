name: Build OSHB lexeme catalog

on:
  push:
    branches: [main]
    paths:
      - 'dtworks2/database/tools/build_oshb_lexeme_catalog.py'
      - 'dtworks2/database/migrations/002_lexeme_layer.sql'
      - '.github/workflows/build-oshb-lexeme-catalog.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lexeme_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lexeme_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build deterministic lexeme catalog
        run: |
          python dtworks2/database/tools/build_oshb_lexeme_catalog.py \
            --output-dir build/oshb-lexemes \
            --chunk-size 750
      - name: Validate catalog manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('build/oshb-lexemes/manifest.json').read_text(encoding='utf-8'))
          assert m['source']['lexicon_commit']=='21c9add13bc727d3a951361778e97e3ff7afd1ce'
          assert m['source']['morphhb_commit']=='3d15126fb1ef74867fc1434be1942e837932691f'
          assert m['catalog_rows'] > 9000, m['catalog_rows']
          assert 1700 < m['genesis_rows'] < 2000, m['genesis_rows']
          assert m['genesis_rows']==m['genesis_keys']
          assert len(m['missing_entries']) == 0, m['missing_entries'][:10]
          assert len(m['genesis_missing']) == 0, m['genesis_missing'][:10]
          assert m['benchmark']['source_lexeme_key']=='7971'
          assert m['benchmark']['lemma_text']=='שָׁלַח', m['benchmark']
          assert m['benchmark']['lemma_search']=='שלח', m['benchmark']
          assert 2 <= len(m['sql_chunks']) <= 4
          print(json.dumps({'ok':True,'catalog_rows':m['catalog_rows'],'genesis_rows':m['genesis_rows'],'chunks':len(m['sql_chunks']),'benchmark':m['benchmark']}, ensure_ascii=False))
          PY
      - name: Validate all Genesis SQL chunks in PostgreSQL 17
        run: |
          psql -h 127.0.0.1 -U postgres -d lexeme_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA core;
          CREATE TABLE core.lexicon_sources (
            id SMALLINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
            code TEXT NOT NULL UNIQUE
          );
          CREATE TABLE core.lexemes (
            id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
            lexicon_source_id SMALLINT NOT NULL REFERENCES core.lexicon_sources(id),
            source_lexeme_key TEXT NOT NULL,
            source_entry_id TEXT,
            language_code TEXT NOT NULL,
            lemma_text TEXT,
            lemma_search TEXT,
            transliteration TEXT,
            strong_number INTEGER,
            pos_code TEXT,
            updated_at TIMESTAMPTZ NOT NULL DEFAULT now(),
            UNIQUE (lexicon_source_id, source_lexeme_key)
          );
          INSERT INTO core.lexicon_sources(code) VALUES ('oshb-hebrew-lexicon');
          SQL
          for f in build/oshb-lexemes/genesis-lexemes-*.sql; do
            psql -h 127.0.0.1 -U postgres -d lexeme_test -v ON_ERROR_STOP=1 -f "$f"
          done
          test "$(psql -h 127.0.0.1 -U postgres -d lexeme_test -Atc "SELECT count(*) FROM core.lexemes")" = "1812"
          test "$(psql -h 127.0.0.1 -U postgres -d lexeme_test -Atc "SELECT lemma_text FROM core.lexemes WHERE source_lexeme_key='7971'")" = "שָׁלַח"
      - name: Upload lexeme catalog artifact
        uses: actions/upload-artifact@v4
        with:
          name: oshb-lexeme-catalog
          path: build/oshb-lexemes/
          retention-days: 14
          if-no-files-found: error
