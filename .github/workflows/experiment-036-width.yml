name: Apply shared dummy frames to all 036 verses
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: asaichi-torah-production
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Replace remaining19 frames preserving all other content
        shell: python
        run: |
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0,'ver3/scripts')
          from prepare_notion_html import request_json
          from notion_frames import creation_blocks, finalize_frames, ensure_upload
          token=os.environ['NOTION_TOKEN']
          page='3d48aa46-08ae-81ae-9391-ede7289a6960'
          run=Path('ver3/runs/036-v3-production-20260907-r1')
          out=Path('all-036-frame-update');out.mkdir(exist_ok=True)
          def children():
              rows=[];cursor=''
              while True:
                  d=request_json('GET',f'/blocks/{page}/children?page_size=100'+('&start_cursor='+cursor if cursor else ''),token)
                  rows+=d['results']
                  if not d['has_more']:return rows
                  cursor=d['next_cursor']
          def stable(b):
              return {k:v for k,v in b.items() if k not in ('last_edited_time','last_edited_by','request_id')}
          before=children()
          payload=json.loads((run/'json3.json').read_text())
          expected=payload['children']
          assert len(before)==len(expected)
          assert [b['type'] for b in before]==[b['type'] for b in expected]
          targets=[]
          for i,(e,b) in enumerate(zip(expected,before)):
              if b['type']!='embed':continue
              assert b['embed'].get('url')==e['embed']['url']
              if b['embed']['url'].endswith(('genesis-25-19.html','genesis-25-20.html')):continue
              assert before[i-1]['type']=='heading_3'
              targets.append({'old_id':b['id'],'after_id':before[i-1]['id'],'url':b['embed']['url'],'expected':e})
          assert len(targets)==19
          uid=ensure_upload(token,out)
          assert uid=='3d48aa46-08ae-81fa-99e2-00b270ed575a', 'Expected previously verified shared dummy'
          record={'page_id':page,'status':'STARTED','file_upload_id':uid,'new_upload_count':0,'targets':targets,'previously_validated_count':2}
          def save():
              (out/'result.json').write_text(json.dumps(record,ensure_ascii=False,indent=2)+'\n')
          save()
          new_ids=[];trashed=[]
          try:
              for t in targets:
                  ids={b['id'] for b in children()}
                  request_json('PATCH',f'/blocks/{page}/children',token,json={'position':{'type':'after_block','after_block':{'id':t['after_id']}},'children':creation_blocks([t['expected']],uid)})
                  added=[b for b in children() if b['id'] not in ids]
                  new_ids.extend(b['id'] for b in added)
                  assert len(added)==1 and added[0]['type']=='embed'
                  t['new_id']=added[0]['id'];save()
                  finalize_frames([t['expected']],added,token)
                  t['pages_stage']='PASS';save()
                  request_json('PATCH',f'/blocks/{t["old_id"]}',token,json={'in_trash':True})
                  trashed.append(t['old_id']);save()
              after=children();mapping={t['old_id']:t['new_id'] for t in targets}
              assert [b['id'] for b in after]==[mapping.get(b['id'],b['id']) for b in before]
              for old,new,e in zip(before,after,expected):
                  if old['id'] not in mapping:assert stable(old)==stable(new), 'Other block changed'
                  else:
                      assert new['embed'].get('url')==e['embed']['url'] and not new['embed'].get('caption')
              record.update(status='PASS',new_frames=19,total_shared_dummy_frames=21,other_blocks_unchanged=True,embed_count=sum(b['type']=='embed' for b in after),audio_count=sum(b['type']=='audio' for b in after));save()
          except Exception as e:
              record.update(status='FAIL',error=str(e),rollback_errors=[])
              for bid in trashed:
                  try:request_json('PATCH',f'/blocks/{bid}',token,json={'in_trash':False})
                  except Exception as re:record['rollback_errors'].append(str(re))
              for bid in new_ids:
                  try:request_json('PATCH',f'/blocks/{bid}',token,json={'in_trash':True})
                  except Exception as re:record['rollback_errors'].append(str(re))
              save();raise
          print(json.dumps({k:v for k,v in record.items() if k!='targets'},ensure_ascii=False))
          
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: all-036-frame-update
          path: all-036-frame-update/
          retention-days: 14
