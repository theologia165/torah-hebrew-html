name: One-off 036 Gen25-19 embed width experiment
on:
  push:
    branches: [asaichi-torah-ver3]
    paths: ['.github/workflows/experiment-036-width.yml']
permissions:
  contents: read
concurrency:
  group: asaichi-torah-production
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Attach same HTML then restore Pages on Gen25-19 only
        shell: python
        run: |
          import json, os, sys, time, hashlib
          from pathlib import Path
          sys.path.insert(0, 'ver3/scripts')
          from prepare_notion_html import request_json, upload_html
          token=os.environ['NOTION_TOKEN']
          page='3d48aa46-08ae-81ae-9391-ede7289a6960'
          url='https://theologia165.github.io/torah-hebrew-html/ver3-public/036-v3-production-20260907-r1/genesis-25-19.html'
          html=Path('ver3/runs/036-v3-production-20260907-r1/html/genesis-25-19.html')
          out=Path('width-experiment'); out.mkdir(exist_ok=True)
          def children():
              rows=[]; cursor=''
              while True:
                  r=request_json('GET',f'/blocks/{page}/children?page_size=100'+('&start_cursor='+cursor if cursor else ''),token)
                  rows+=r['results']
                  if not r['has_more']:return rows
                  cursor=r['next_cursor']
          def stable(b):
              return {k:v for k,v in b.items() if k not in ('last_edited_time','last_edited_by','request_id')}
          before=children()
          targets=[b for b in before if b['type']=='embed' and b['embed'].get('url')==url]
          assert len(targets)==1, 'Expected exactly one Gen.25.19 Pages embed'
          target=targets[0]; bid=target['id']; original=target['embed']
          assert original.get('caption',[])==[]
          record={'page_id':page,'block_id':bid,'ref':'Gen.25.19','original_url':url,'html_sha256':hashlib.sha256(html.read_bytes()).hexdigest(),'status':'STARTED','visual_width_status':'REQUIRES_NOTION_UI_CONFIRMATION'}
          def save():
              (out/'result.json').write_text(json.dumps(record,ensure_ascii=False,indent=2)+'\n')
          save()
          upload=upload_html(html,token); record['upload_id']=upload
          index=next(i for i,b in enumerate(before) if b['id']==bid)
          assert index>0 and before[index-1]['type']=='heading_3'
          new_id=None
          try:
              created=request_json('PATCH',f'/blocks/{page}/children',token,json={'after':before[index-1]['id'],'children':[{'object':'block','type':'embed','embed':{'type':'file_upload','file_upload':{'id':upload},'caption':[]}}]})
              assert len(created['results'])==1
              new_id=created['results'][0]['id']; record['new_block_id']=new_id
              attached=request_json('GET',f'/blocks/{new_id}',token)
              assert attached['type']=='embed' and attached['embed'].get('url') and attached['embed']['url']!=url
              record['attachment_stage']='PASS'; save()
              time.sleep(2)
              request_json('PATCH',f'/blocks/{new_id}',token,json={'embed':{'url':url,'caption':[]}})
              final=request_json('GET',f'/blocks/{new_id}',token)
              assert final['embed'].get('url')==url and not final['embed'].get('caption')
              request_json('PATCH',f'/blocks/{bid}',token,json={'archived':True})
              after=children()
              assert [b['id'] for b in after]==[new_id if b['id']==bid else b['id'] for b in before]
              for old,new in zip(before,after):
                  if old['id']!=bid: assert stable(old)==stable(new), 'Other block changed: '+old['id']
          except Exception:
              request_json('PATCH',f'/blocks/{bid}',token,json={'archived':False})
              if new_id:request_json('PATCH',f'/blocks/{new_id}',token,json={'archived':True})
              raise
          record.update(status='PASS',pages_restored=True,other_blocks_unchanged=True,embed_count=sum(b['type']=='embed' for b in after),audio_count=sum(b['type']=='audio' for b in after))
          save();print(json.dumps(record,ensure_ascii=False))
          
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment-036-width
          path: width-experiment/
          retention-days: 14
