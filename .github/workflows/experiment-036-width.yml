name: One-off 036 Gen25-19 embed width experiment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: asaichi-torah-production
  cancel-in-progress: false
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Attach same HTML then restore Pages on Gen25-19 only
        shell: python
        run: |
          import json, os, sys, time, hashlib
          from pathlib import Path
          sys.path.insert(0, 'ver3/scripts')
          from prepare_notion_html import request_json, upload_html
          token=os.environ['NOTION_TOKEN']
          page='3d48aa46-08ae-81ae-9391-ede7289a6960'
          url='https://theologia165.github.io/torah-hebrew-html/ver3-public/036-v3-production-20260907-r1/genesis-25-19.html'
          html=Path('ver3/runs/036-v3-production-20260907-r1/html/genesis-25-19.html')
          out=Path('width-experiment'); out.mkdir(exist_ok=True)
          def children():
              rows=[]; cursor=''
              while True:
                  r=request_json('GET',f'/blocks/{page}/children?page_size=100'+('&start_cursor='+cursor if cursor else ''),token)
                  rows+=r['results']
                  if not r['has_more']:return rows
                  cursor=r['next_cursor']
          def stable(b):
              return {k:v for k,v in b.items() if k not in ('last_edited_time','last_edited_by','request_id')}
          before=children()
          bid='3d48aa46-08ae-81f7-b51f-e1944afce296'
          new_id='3d48aa46-08ae-81aa-91ab-e9d8f01f9acb'
          old=next(b for b in before if b['id']==bid)
          new=next(b for b in before if b['id']==new_id)
          assert old['embed'].get('url')==url
          assert new['type']=='embed' and 'genesis-25-19.html' in new['embed'].get('url','')
          assert [b['id'] for b in before].index(new_id)+1==[b['id'] for b in before].index(bid)
          record={'page_id':page,'original_block_id':bid,'new_block_id':new_id,'ref':'Gen.25.19','original_url':url,'attachment_stage':'PASS','visual_width_status':'REQUIRES_NOTION_UI_CONFIRMATION'}
          try:
              request_json('PATCH',f'/blocks/{new_id}',token,json={'embed':{'url':url,'caption':[]}})
              final=request_json('GET',f'/blocks/{new_id}',token)
              assert final['embed'].get('url')==url and not final['embed'].get('caption')
              request_json('PATCH',f'/blocks/{bid}',token,json={'in_trash':True})
              after=children()
              assert [b['id'] for b in after]==[b['id'] for b in before if b['id']!=bid]
              amap={b['id']:b for b in after}
              for b in before:
                  if b['id'] not in (bid,new_id):assert stable(b)==stable(amap[b['id']]), 'Other block changed'
          except Exception:
              request_json('PATCH',f'/blocks/{bid}',token,json={'in_trash':False})
              request_json('PATCH',f'/blocks/{new_id}',token,json={'in_trash':True})
              raise
          record.update(status='PASS',pages_restored=True,other_blocks_unchanged=True,embed_count=sum(b['type']=='embed' for b in after),audio_count=sum(b['type']=='audio' for b in after))
          (out/'result.json').write_text(json.dumps(record,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(record,ensure_ascii=False))
          
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment-036-width
          path: width-experiment/
          retention-days: 14
