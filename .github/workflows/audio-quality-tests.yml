name: Audio quality regression
on:
  pull_request:
    branches: [asaichi-torah-ver3]
    paths: ['ver3/scripts/**', 'ver3/quality/audio/**', 'ver3/spec/audio-quality.md', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          for apt_source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$apt_source" ]; then
              sudo sed -i -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' -e 's|http://archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install requests beautifulsoup4
      - run: |
          python -m compileall -q ver3/scripts
          python ver3/scripts/test_audio_quality.py
          python ver3/scripts/test_audio_primary_module.py
          python ver3/scripts/test_audio_fallback_policy.py
          python ver3/scripts/test_handoff_contract.py
