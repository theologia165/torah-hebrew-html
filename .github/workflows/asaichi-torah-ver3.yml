name: Asaichi Torah Ver.3
on:
  push:
    branches: [asaichi-torah-ver3]
    paths: ['ver3/request.json', 'ver3/runs/**/json2.json', 'ver3/scripts/**', 'ver3/templates/**', '.github/workflows/asaichi-torah-ver3.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: asaichi-torah-production
  cancel-in-progress: false
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL || secrets.DATABASE_URL_UNPOOLED || secrets.DATABASE_URL }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: asaichi-torah-ver3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install 'psycopg[binary]==3.2.9' requests beautifulsoup4
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Validate Python and browser script syntax
        run: |
          python -m compileall -q ver3/scripts
          node --check ver3/templates/search.js
      - name: Neon JSON1 → JSON1.1 → ChatGPT JSON2 → Notion JSON3
        run: python ver3/scripts/runner.py
      - name: Keep run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asaichi-ver3-${{ github.run_number }}
          path: ver3/runs/
          retention-days: 14
