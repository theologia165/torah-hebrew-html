name: Asaichi Torah Ver.3
on:
  push:
    branches: [asaichi-torah-ver3]
    paths: ['ver3/request.json', 'ver3/runs/**/json2.json', 'ver3/runs/**/cover-ready.json', 'ver3/runs/**/completion.json', 'ver3/runs/**/ai-audio-request.json', 'ver3/runs/**/research-style-refresh.json', 'ver3/runs/**/audio-repair.json', 'ver3/runs/**/audio-repairs/**/audio-content-review.json', 'ver3/state/production.json', 'ver3/scripts/**', 'ver3/spec/**', 'ver3/quality/audio/**', 'ver3/templates/**', 'ver3/config/audio-fallback.json', 'ver3/config/open-bible-sources.json', '.github/workflows/asaichi-torah-ver3.yml']
  workflow_dispatch:
    inputs:
      audio_quality_run_id:
        description: '音声品質管理部で修復する既存RUN（空欄は通常実行）'
        required: false
        default: ''
        type: string
permissions:
  contents: write
  pages: write
concurrency:
  group: asaichi-torah-production
  cancel-in-progress: false
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL || secrets.DATABASE_URL_UNPOOLED || secrets.DATABASE_URL }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: asaichi-torah-images
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: asaichi-torah-ver3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install 'psycopg[binary]==3.2.9' requests beautifulsoup4 boto3 pillow
          # Avoid the stalled HTTP Azure mirror seen during production 082.
          for apt_source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$apt_source" ]; then
              sudo sed -i -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' -e 's|http://archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Validate Python and browser script syntax
        run: |
          python -m compileall -q ver3/scripts
          python ver3/scripts/test_audio_primary_module.py
          python ver3/scripts/test_audio_fallback_policy.py
          python ver3/scripts/test_audio_quality.py
          python ver3/scripts/test_handoff_contract.py
          node --check ver3/templates/search.js
      - name: Neon JSON1 → JSON1.1 → ChatGPT JSON2 → Notion JSON3
        env:
          AUDIO_QUALITY_RUN_ID: ${{ inputs.audio_quality_run_id }}
        run: |
          if [ -n "$AUDIO_QUALITY_RUN_ID" ]; then
            [[ "$AUDIO_QUALITY_RUN_ID" =~ ^[0-9]{3}-[0-9]{8}-r[0-9]+$ ]] || exit 1
            python ver3/scripts/audio_quality.py repair "ver3/runs/$AUDIO_QUALITY_RUN_ID"
          else
            python ver3/scripts/runner.py
          fi
      - name: Keep run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asaichi-ver3-${{ github.run_number }}
          path: ver3/runs/
          retention-days: 14
