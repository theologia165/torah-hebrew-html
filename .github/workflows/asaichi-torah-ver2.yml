name: Asaichi Torah Ver.2

on:
  push:
    branches:
      - asaichi-torah-ver2
    paths:
      - 'ver2/input/current.json'
      - 'ver2/schema/**'
      - 'ver2/scripts/**'
      - '.github/workflows/asaichi-torah-ver2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build-html:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Enrich from pinned MorphHB
        run: |
          rm -rf ver2/work
          python ver2/scripts/enrich_morphhb.py ver2/input/current.json ver2/work/current.enriched.json

      - name: Reject placeholder morphology
        run: |
          python - <<'PY'
          import json
          p='ver2/work/current.enriched.json'
          d=json.load(open(p,encoding='utf-8'))
          bad=[]
          for v in d['verses']:
              for i,w in enumerate(v['words'],1):
                  if w['morph_code']=='TEST' or w['pos']=='要MorphHB照合' or '展開試験用' in w['morph']:
                      bad.append(f"{v['verse']}:{i}")
          if bad:
              raise SystemExit('FAIL placeholder morphology: '+','.join(bad))
          print('PASS: no placeholder morphology fields')
          PY

      - name: Validate enriched JSON
        run: python ver2/scripts/validate.py ver2/work/current.enriched.json

      - name: Build HTML
        run: |
          rm -rf ver2/output
          python ver2/scripts/build_html.py ver2/work/current.enriched.json ver2/output

      - name: Verify HTML acceptance contract
        run: python ver2/scripts/verify_html.py ver2/work/current.enriched.json ver2/output

      - name: List generated files
        run: find ver2/output -type f -maxdepth 3 -print

      - name: Upload enriched JSON and generated HTML
        uses: actions/upload-artifact@v4
        with:
          name: asaichi-torah-ver2-html-${{ github.run_number }}
          path: |
            ver2/work/current.enriched.json
            ver2/output/
          if-no-files-found: error
          retention-days: 14
