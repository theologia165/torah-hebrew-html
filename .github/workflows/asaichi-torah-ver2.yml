name: Asaichi Torah Ver.2

on:
  push:
    branches:
      - asaichi-torah-ver2
    paths:
      - 'ver2/input/current.json'
      - 'ver2/content/**'
      - 'ver2/schema/**'
      - 'ver2/scripts/**'
      - '.github/workflows/asaichi-torah-ver2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-build-html-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: asaichi-torah-ver2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Install ffmpeg toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Enrich from pinned MorphHB
        run: |
          rm -rf ver2/work
          python ver2/scripts/enrich_morphhb.py ver2/input/current.json ver2/work/current.enriched.json

      - name: Refine Japanese morphology labels
        run: python ver2/scripts/refine_morphology_ja.py ver2/work/current.enriched.json

      - name: Merge researched commentary
        run: |
          SEQ=$(python - <<'PY'
          import json
          print(json.load(open('ver2/work/current.enriched.json',encoding='utf-8'))['sequence'])
          PY
          )
          python ver2/scripts/merge_commentary.py ver2/work/current.enriched.json "ver2/content/${SEQ}-commentary.json"

      - name: Reject placeholder morphology
        run: |
          python - <<'PY'
          import json
          p='ver2/work/current.enriched.json'
          d=json.load(open(p,encoding='utf-8'))
          bad=[]
          for v in d['verses']:
              for i,w in enumerate(v['words'],1):
                  if w['morph_code']=='TEST' or w['pos']=='要MorphHB照合' or '展開試験用' in w['morph']:
                      bad.append(f"{v['verse']}:{i}")
          if bad:
              raise SystemExit('FAIL placeholder morphology: '+','.join(bad))
          print('PASS: no placeholder morphology fields')
          PY

      - name: Reject placeholder commentary
        run: |
          python - <<'PY'
          import json
          d=json.load(open('ver2/work/current.enriched.json',encoding='utf-8'))
          bad=[]
          for v in d['verses']:
              if '構造展開試験' in v.get('short_commentary','') or '本番用の節固有解説' in v.get('detailed_commentary',''):
                  bad.append(str(v['verse']))
          if bad:
              raise SystemExit('FAIL placeholder commentary: '+','.join(bad))
          print('PASS: researched commentary present for all verses')
          PY

      - name: Validate enriched JSON
        run: python ver2/scripts/validate.py ver2/work/current.enriched.json

      - name: Build HTML
        run: |
          rm -rf ver2/output
          python ver2/scripts/build_html.py ver2/work/current.enriched.json ver2/output

      - name: Verify HTML acceptance contract
        run: python ver2/scripts/verify_html.py ver2/work/current.enriched.json ver2/output

      - name: Build PocketTorah audio
        run: |
          rm -rf ver2/audio
          python ver2/scripts/build_audio.py ver2/work/current.enriched.json ver2/audio

      - name: Verify deterministic audio acceptance contract
        run: python ver2/scripts/verify_audio.py ver2/audio

      - name: Report audio state
        run: |
          python - <<'PY'
          import json
          m=json.load(open('ver2/audio/audio_manifest.json',encoding='utf-8'))
          print('MAPPING_CONFIRMED=',m['qa']['MAPPING_CONFIRMED'])
          print('SIGNAL_CHECKED=',m['qa']['SIGNAL_CHECKED'])
          print('MODEL_AUDIO_CHECKED=',m['qa']['MODEL_AUDIO_CHECKED'],'(optional / not run in normal workflow)')
          print('PASS: normal audio pipeline complete')
          PY

      - name: Publish current Ver.2 assets to branch
        run: |
          SEQ=$(python - <<'PY'
          import json
          print(json.load(open('ver2/work/current.enriched.json',encoding='utf-8'))['sequence'])
          PY
          )
          PUB="ver2/published/${SEQ}"
          rm -rf "$PUB"
          mkdir -p "$PUB/html" "$PUB/audio"
          cp ver2/output/${SEQ}/*.html "$PUB/html/"
          cp ver2/audio/${SEQ}_*_r2.mp3 "$PUB/audio/"
          cp ver2/audio/audio_manifest.json "$PUB/audio/"
          cp ver2/work/current.enriched.json "$PUB/current.enriched.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PUB"
          if git diff --cached --quiet; then
            echo "No published asset changes"
          else
            git commit -m "Publish Ver.2 ${SEQ} assets for Notion"
            git push origin HEAD:asaichi-torah-ver2
          fi

      - name: List generated files
        run: |
          find ver2/output -type f -maxdepth 3 -print
          find ver2/audio -type f -maxdepth 2 -print

      - name: Upload enriched JSON and generated HTML
        uses: actions/upload-artifact@v4
        with:
          name: asaichi-torah-ver2-html-${{ github.run_number }}
          path: |
            ver2/work/current.enriched.json
            ver2/output/
          if-no-files-found: error
          retention-days: 14

      - name: Upload audio package
        uses: actions/upload-artifact@v4
        with:
          name: asaichi-torah-ver2-audio-${{ github.run_number }}
          path: ver2/audio/
          if-no-files-found: error
          retention-days: 14
