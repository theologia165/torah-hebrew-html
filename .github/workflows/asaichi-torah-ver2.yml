name: Asaichi Torah Ver.2

on:
  push:
    branches:
      - asaichi-torah-ver2
    paths:
      - 'ver2/input/current.json'
      - 'ver2/schema/**'
      - 'ver2/scripts/**'
      - '.github/workflows/asaichi-torah-ver2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build-html:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Validate Work JSON
        run: python ver2/scripts/validate.py ver2/input/current.json

      - name: Build HTML
        run: |
          rm -rf ver2/output
          python ver2/scripts/build_html.py ver2/input/current.json ver2/output

      - name: List generated files
        run: find ver2/output -type f -maxdepth 3 -print

      - name: Upload generated HTML
        uses: actions/upload-artifact@v4
        with:
          name: asaichi-torah-ver2-html-${{ github.run_number }}
          path: ver2/output/
          if-no-files-found: error
          retention-days: 14
