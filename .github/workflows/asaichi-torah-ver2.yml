name: Asaichi Torah Ver.2

on:
  push:
    branches:
      - asaichi-torah-ver2
    paths:
      - 'ver2/input/current.json'
      - 'ver2/content/**'
      - 'ver2/schema/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-build-html-audio-notion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VER2_BRANCH: asaichi-torah-ver2
      PAGES_BASE_URL: https://theologia165.github.io/torah-hebrew-html
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
    steps:
      - name: Checkout Ver.2 branch
        uses: actions/checkout@v4
        with:
          ref: asaichi-torah-ver2
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check jsonschema requests

      - name: Install ffmpeg toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
          command -v ffprobe

      - name: Enrich from pinned MorphHB
        run: |
          rm -rf ver2/work
          python ver2/scripts/enrich_morphhb.py ver2/input/current.json ver2/work/current.enriched.json

      - name: Refine Japanese morphology labels
        run: python ver2/scripts/refine_morphology_ja.py ver2/work/current.enriched.json

      - name: Merge researched commentary
        run: |
          SEQ=$(python - <<'PY'
          import json
          print(json.load(open('ver2/work/current.enriched.json',encoding='utf-8'))['sequence'])
          PY
          )
          python ver2/scripts/merge_commentary.py ver2/work/current.enriched.json "ver2/content/${SEQ}-commentary.json"

      - name: Reject placeholders
        run: |
          python - <<'PY'
          import json
          d=json.load(open('ver2/work/current.enriched.json',encoding='utf-8'))
          bad=[]
          for v in d['verses']:
              if '構造展開試験' in v.get('short_commentary','') or '本番用の節固有解説' in v.get('detailed_commentary',''):
                  bad.append(str(v['verse']))
              for i,w in enumerate(v['words'],1):
                  if w['morph_code']=='TEST' or w['pos']=='要MorphHB照合' or '展開試験用' in w['morph']:
                      bad.append(f"{v['verse']}:{i}")
          if bad:
              raise SystemExit('FAIL placeholder data: '+','.join(bad))
          print('PASS: no placeholder data')
          PY

      - name: Validate enriched JSON
        run: python ver2/scripts/validate.py ver2/work/current.enriched.json

      - name: Build and verify HTML
        run: |
          rm -rf ver2/output
          python ver2/scripts/build_html.py ver2/work/current.enriched.json ver2/output
          python ver2/scripts/verify_html.py ver2/work/current.enriched.json ver2/output

      - name: Build and verify PocketTorah audio
        run: |
          rm -rf ver2/audio
          python ver2/scripts/build_audio.py ver2/work/current.enriched.json ver2/audio
          python ver2/scripts/verify_audio.py ver2/audio

      - name: Publish Ver.2 assets to branch
        run: |
          SEQ=$(python - <<'PY'
          import json
          print(json.load(open('ver2/work/current.enriched.json',encoding='utf-8'))['sequence'])
          PY
          )
          PUB="ver2/published/${SEQ}"
          mkdir -p "$PUB/html" "$PUB/audio"
          for src in ver2/output/${SEQ}/*.html; do
            dst="$PUB/html/$(basename "$src")"
            if [ -e "$dst" ] && ! cmp -s "$src" "$dst"; then
              echo "Refusing to overwrite existing HTML: $dst" >&2
              exit 21
            fi
            [ -e "$dst" ] || cp "$src" "$dst"
          done
          for src in ver2/audio/${SEQ}_*_r2.mp3; do
            dst="$PUB/audio/$(basename "$src")"
            if [ -e "$dst" ] && ! cmp -s "$src" "$dst"; then
              echo "Refusing to overwrite existing audio: $dst" >&2
              exit 22
            fi
            [ -e "$dst" ] || cp "$src" "$dst"
          done
          for pair in "ver2/audio/audio_manifest.json:$PUB/audio/audio_manifest.json" "ver2/work/current.enriched.json:$PUB/current.enriched.json"; do
            src="${pair%%:*}"; dst="${pair#*:}"
            if [ -e "$dst" ] && ! cmp -s "$src" "$dst"; then
              echo "Refusing to overwrite existing published metadata: $dst" >&2
              exit 23
            fi
            [ -e "$dst" ] || cp "$src" "$dst"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PUB"
          if ! git diff --cached --quiet; then
            git commit -m "Publish Ver.2 ${SEQ} assets"
            git push origin HEAD:asaichi-torah-ver2
          fi

      - name: Publish HTML to immutable GitHub Pages paths and build manifest
        run: |
          SEQ=$(python - <<'PY'
          import json
          print(json.load(open('ver2/work/current.enriched.json',encoding='utf-8'))['sequence'])
          PY
          )
          rm -rf /tmp/torah-pages
          git worktree add /tmp/torah-pages origin/main
          python ver2/scripts/publish_pages.py \
            ver2/work/current.enriched.json \
            "ver2/output/${SEQ}" \
            /tmp/torah-pages \
            "$PAGES_BASE_URL" \
            "ver2/state/${SEQ}-pages-map.json"
          cd /tmp/torah-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$SEQ"
          if ! git diff --cached --quiet; then
            git commit -m "Publish Torah HTML ${SEQ} for Notion embed"
            git push origin HEAD:main
          fi

      - name: Deliver finished page from GitHub to Notion
        id: notion_delivery
        continue-on-error: true
        run: |
          SEQ=$(python - <<'PY'
          import json
          print(json.load(open('ver2/work/current.enriched.json',encoding='utf-8'))['sequence'])
          PY
          )
          python ver2/scripts/notion_delivery.py "ver2/published/${SEQ}/current.enriched.json"

      - name: Persist Pages and Notion delivery audit
        if: always()
        run: |
          git switch asaichi-torah-ver2
          git pull --ff-only origin asaichi-torah-ver2
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ver2/state/*-pages-map.json ver2/state/*-notion-delivery.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Record Ver.2 delivery audit"
            git push origin HEAD:asaichi-torah-ver2
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: asaichi-torah-ver2-${{ github.run_number }}
          path: |
            ver2/work/current.enriched.json
            ver2/output/
            ver2/audio/
          if-no-files-found: error
          retention-days: 14
