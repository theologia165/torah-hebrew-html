name: Qohelet study 2026-11-01
on:
  push:
    branches: ['study/qohelet-9-17-10-20-20261030']
    paths: ['study/qohelet-20261101/build_media.py', 'study/qohelet-20261101/media-request.json', '.github/workflows/qohelet-study-20261101.yml']
permissions:
  contents: write
concurrency:
  group: qohelet-study-20261101
  cancel-in-progress: false
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL || secrets.DATABASE_URL_UNPOOLED || secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]==3.2.9' requests
      - run: ffmpeg -version
      - run: python study/qohelet-20261101/build_media.py
