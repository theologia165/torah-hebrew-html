name: Qohelet study 2026-11-01
on:
  push:
    branches: ['study/qohelet-9-17-10-20-20261030']
    paths: ['study/qohelet-20261101/build_media.py', 'study/qohelet-20261101/import_audio.py', 'study/qohelet-20261101/media-request.json', '.github/workflows/qohelet-study-20261101.yml']
permissions:
  contents: write
concurrency:
  group: qohelet-study-20261101
  cancel-in-progress: false
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL || secrets.DATABASE_URL_UNPOOLED || secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]==3.2.9' requests faster-whisper
      - name: Install audio tools
        run: |
          for apt_source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$apt_source" ]; then
              sudo sed -i -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' -e 's|http://archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$apt_source"
            fi
          done
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -y --no-install-recommends install ffmpeg
          ffmpeg -version
      - run: python study/qohelet-20261101/import_audio.py
