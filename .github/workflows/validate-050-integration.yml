name: Validate 050 Notion integration

on:
  push:
    branches: [main]
    paths:
      - 'experiments/050-asaichi-db-integration/**'
      - 'experiments/050-cloudflare-neon/**'
      - '.github/workflows/validate-050-integration.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker dependencies
        working-directory: experiments/050-cloudflare-neon
        run: npm install --no-audit --no-fund
      - name: Unit test Worker query contracts
        working-directory: experiments/050-cloudflare-neon
        run: npm test
      - name: Typecheck Worker
        working-directory: experiments/050-cloudflare-neon
        run: npm run typecheck
      - name: Wrangler dry-run bundle
        working-directory: experiments/050-cloudflare-neon
        run: npm run build
      - name: Fetch Genesis 32:4 JSON from Neon through the DTWorks API
        run: |
          mkdir -p build
          node experiments/050-asaichi-db-integration/build_prompt_input.mjs \
            morphhb-wlc Gen.32.4 build/json1-neon.json
      - name: Validate Cloudflare → Neon → 050 render contract
        env:
          NEON_SNAPSHOT: build/json1-neon.json
        run: node experiments/050-asaichi-db-integration/validate-integration.mjs
      - name: Upload verified non-secret Neon JSON
        uses: actions/upload-artifact@v4
        with:
          name: 050-genesis-32-4-neon-json
          path: build/json1-neon.json
          if-no-files-found: error
