name: Finalize corrected 039 replacement
on:
  push:
    branches: [asaichi-torah-ver3]
    paths: ['.github/workflows/finalize-039-r2-replacement.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: asaichi-torah-ver3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Archive superseded 039 and restore canonical title
        run: |
          python ver3/scripts/finalize_replacement.py \
            ver3/runs/039-20260908-r2 \
            3d58aa46-08ae-8122-97ce-c80c7c4c27b0 \
            3d58aa46-08ae-815a-8460-d88e8f8e15d7 \
            '039｜創世記26:23–29'
      - name: Commit replacement audit or failure record
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ver3/runs/039-20260908-r2/delivery.json
          if [ -f ver3/runs/039-20260908-r2/replacement-finalize-error.json ]; then
            git add ver3/runs/039-20260908-r2/replacement-finalize-error.json
          fi
          git diff --cached --quiet || git commit -m 'Finalize corrected 039 replacement'
          git push origin HEAD:asaichi-torah-ver3
