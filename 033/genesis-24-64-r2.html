<!doctype html><html lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Genesis 24:64</title><style>*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#12233f;font-family:"Noto Sans Hebrew","Times New Roman",serif}body{padding:34px 12px 72px;overflow-x:hidden}.verse{direction:rtl;text-align:center;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:10px 6px;max-width:100%;margin:0 auto}.word{display:inline-flex;flex-direction:column;align-items:center;max-width:100%}.tok{display:inline-block;cursor:pointer;border-radius:6px;padding:1px 3px;outline:none;font-size:clamp(29px,6vw,49px);line-height:1.35;white-space:nowrap}.tok:hover,.tok:focus{background:#eef4ff}.gloss{direction:ltr;font-family:system-ui,sans-serif;font-size:12px;line-height:1.25;color:#596579;margin-top:3px;white-space:normal;max-width:120px;text-align:center}.maqaf,.sof{font-size:clamp(29px,6vw,49px);line-height:1.35;align-self:flex-start;padding-top:1px}.popup{position:fixed;display:none;direction:ltr;text-align:left;width:min(360px,calc(100vw - 16px));max-height:calc(100vh - 16px);overflow:auto;background:#fff;color:#15243b;border:1px solid #d7dfeb;border-radius:10px;box-shadow:0 8px 28px #0003;padding:12px 14px;z-index:9999;font-family:system-ui,sans-serif;font-size:14px;line-height:1.55;overflow-wrap:anywhere}.popup.open{display:block}.popup b{color:#163a70}.src{margin-top:24px;text-align:center;font:12px/1.4 system-ui,sans-serif;color:#667085}@media (pointer:coarse){.tok{padding:4px}.verse{gap:12px 7px}}</style></head><body><div class="verse" aria-label="Genesis 24:64"><span class="word"><span class="tok" tabindex="0" data-l="נָשָׂא" data-p="動詞" data-m="語幹：カル・形：ワイイクトール・3人称・女性・単数">וַתִּשָּׂ֤א</span><span class="gloss">そして彼女は上げた</span></span><span class="word"><span class="tok" tabindex="0" data-l="רִבְקָה" data-p="固有名詞" data-m="女性・単数">רִבְקָה֙</span><span class="gloss">リベカは</span></span><span class="word"><span class="tok" tabindex="0" data-l="אֵת" data-p="目的語標識" data-m="目的語を示す標識">אֶת</span><span class="gloss">〜を</span></span><span class="maqaf">־</span><span class="word"><span class="tok" tabindex="0" data-l="עַיִן" data-p="名詞" data-m="共通・双数・連語形＋接尾代名詞：3人称・女性・単数">עֵינֶ֔יהָ</span><span class="gloss">彼女の目を</span></span><span class="word"><span class="tok" tabindex="0" data-l="רָאָה" data-p="動詞" data-m="語幹：カル・形：ワイイクトール・3人称・女性・単数">וַתֵּ֖רֶא</span><span class="gloss">そして彼女は見た</span></span><span class="word"><span class="tok" tabindex="0" data-l="אֵת" data-p="目的語標識" data-m="目的語を示す標識">אֶת</span><span class="gloss">〜を</span></span><span class="maqaf">־</span><span class="word"><span class="tok" tabindex="0" data-l="יִצְחָק" data-p="固有名詞" data-m="男性・単数">יִצְחָ֑ק</span><span class="gloss">イサクを</span></span><span class="word"><span class="tok" tabindex="0" data-l="נָפַל" data-p="動詞" data-m="語幹：カル・形：ワイイクトール・3人称・女性・単数">וַתִּפֹּ֖ל</span><span class="gloss">そして彼女は身を下ろした</span></span><span class="word"><span class="tok" tabindex="0" data-l="מֵעַל" data-p="前置詞" data-m="前置詞 מִן『〜から』＋ עַל『〜の上』">מֵעַ֥ל</span><span class="gloss">〜の上から</span></span><span class="word"><span class="tok" tabindex="0" data-l="גָּמָל" data-p="名詞" data-m="男性・単数・絶対形＋定冠詞">הַגָּמָֽל</span><span class="gloss">そのらくだの</span></span><span class="sof">׃</span></div><div id="p" class="popup" role="dialog"></div><div class="src">Open Scriptures Hebrew Bible / MorphHB (WLC), CC BY 4.0</div><script>const p=document.getElementById('p');function esc(s){return String(s||'—').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function show(t){p.innerHTML='<b>lemma：</b><span dir="rtl">'+esc(t.dataset.l)+'</span><br><b>品詞：</b>'+esc(t.dataset.p)+'<br><b>形態：</b>'+esc(t.dataset.m);p.classList.add('open');requestAnimationFrame(()=>{const r=t.getBoundingClientRect(),q=p.getBoundingClientRect(),g=8,m=8;let x=r.left+r.width/2-q.width/2;x=Math.max(m,Math.min(x,innerWidth-q.width-m));let y=r.bottom+g;if(y+q.height>innerHeight-m)y=r.top-q.height-g;y=Math.max(m,Math.min(y,innerHeight-q.height-m));p.style.left=x+'px';p.style.top=y+'px'})}document.querySelectorAll('.tok').forEach(t=>{t.addEventListener('mouseenter',()=>{if(matchMedia('(pointer:fine)').matches)show(t)});t.addEventListener('mouseleave',()=>{if(matchMedia('(pointer:fine)').matches)p.classList.remove('open')});t.addEventListener('focus',()=>show(t));t.addEventListener('click',e=>{if(matchMedia('(pointer:coarse)').matches){e.stopPropagation();show(t)}})});document.addEventListener('click',e=>{if(!e.target.closest('.tok'))p.classList.remove('open')});addEventListener('resize',()=>p.classList.remove('open'));</script></body></html>
