<!doctype html><html lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>033 Interactive Hebrew</title><style>*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#12233f;font-family:"Noto Sans Hebrew","Times New Roman",serif}body{padding:34px 12px 72px;overflow-x:hidden}.verse{direction:rtl;text-align:center;font-size:clamp(29px,6vw,49px);line-height:1.45}.word{display:inline-flex;flex-direction:column;align-items:center;vertical-align:top;margin:0 2px 10px}.tok{display:inline-block;cursor:pointer;border-radius:6px;padding:1px 3px;outline:none;line-height:1.25;white-space:nowrap}.tok:hover,.tok:focus{background:#eef4ff}.gloss{direction:ltr;font-family:system-ui,sans-serif;font-size:12px;line-height:1.25;color:#596579;margin-top:3px;max-width:125px;text-align:center}.popup{position:fixed;display:none;direction:ltr;text-align:left;width:min(360px,calc(100vw - 16px));max-height:calc(100vh - 16px);overflow:auto;background:#fff;color:#15243b;border:1px solid #d7dfeb;border-radius:10px;box-shadow:0 8px 28px #0003;padding:12px 14px;z-index:9999;font-family:system-ui,sans-serif;font-size:14px;line-height:1.55}.popup.open{display:block}.popup b{color:#163a70}.src{margin-top:22px;text-align:center;font:12px/1.4 system-ui,sans-serif;color:#667085}.err{direction:ltr;text-align:center;font:14px/1.6 system-ui,sans-serif;color:#8a1c1c}</style></head><body><div id="host"></div><div id="p" class="popup"></div><div class="src">Open Scriptures Hebrew Bible / MorphHB (WLC), CC BY 4.0</div><script>
const v=new URLSearchParams(location.search).get('verse'),host=document.getElementById('host'),p=document.getElementById('p');
const person={1:'1人称',2:'2人称',3:'3人称'},gender={m:'男性',f:'女性',c:'共通',b:'男女共通'},num={s:'単数',p:'複数',d:'双数'},state={a:'絶対形',c:'連語形',d:'状態不定'};
function noun(s){const m=s.match(/^N[cgp]([mfcb])([spd])([acd])$/);return m?'名詞：'+gender[m[1]]+'・'+num[m[2]]+'・'+state[m[3]]:'名詞（詳細形態あり）'}
function suffix(s){const m=s.match(/^Sp([123])([mfcb])([spd])$/);return m?'接尾代名詞：'+person[m[1]]+'・'+gender[m[2]]+'・'+num[m[3]]:'接尾代名詞'}
function numeral(s){const m=s.match(/^A([co])([mfcb])([spd])([ac])$/);return m?'数詞：'+(m[1]==='c'?'基数詞':'序数詞')+'・'+gender[m[2]]+'・'+num[m[3]]+'・'+state[m[4]]:'数詞'}
function verb(s){const stem={q:'カル',N:'ニファル',p:'ピエル',P:'プアル',h:'ヒフィル',H:'ホファル',t:'ヒトパエル'},form={w:'ワイイクトール',p:'完了形',i:'未完了形',v:'命令形',h:'コホータティブ',j:'未完了形／指示形',c:'不定詞連語形',a:'不定詞絶対形',r:'分詞'};let a=s.slice(1),out=['語幹：'+(stem[a[0]]||'その他'),'形：'+(form[a[1]]||'その他')],r=a.slice(2),m=r.match(/^([123])([mfcb])([spd])/);if(m){out.push(person[m[1]],gender[m[2]],num[m[3]]);r=r.slice(3)}else{m=r.match(/^([mfcb])([spd])([ac]?)/);if(m){out.push(gender[m[1]],num[m[2]]);if(m[3])out.push(m[3]==='a'?'絶対用法':'連語用法');r=r.slice(m[0].length)}}if(r)out.push('付加的な形態要素あり');return out.join('・')}
function part(s){s=s.replace(/^H/,'');if(s==='C')return'接続詞';if(s==='R')return'前置詞';if(s==='Rd')return'前置詞＋定冠詞';if(s==='Td')return'定冠詞';if(s==='Tr')return'関係詞';if(s==='Ti')return'疑問詞';if(s==='Tn')return'否定辞';if(s==='To')return'目的語標識';if(s==='Tm')return'提示・談話標識';if(s==='Np')return'固有名詞';if(s==='Sd')return'方向を示す語尾';if(s.startsWith('Sp'))return suffix(s);if(s.startsWith('N'))return noun(s);if(s.startsWith('Pp')){const m=s.match(/^Pp([123])([mfcb])([spd])$/);return m?'人称代名詞：'+person[m[1]]+'・'+gender[m[2]]+'・'+num[m[3]]:'人称代名詞'}if(s.startsWith('Pd')){const m=s.match(/^Pdx([mfcb])([spd])$/);return m?'指示代名詞：'+gender[m[1]]+'・'+num[m[2]]:'指示代名詞'}if(s.startsWith('A'))return numeral(s);if(s.startsWith('V'))return verb(s);return'その他の文法要素'}
function morph(raw){if(!raw)return'—';let s=raw.replace(/MorphHB\s*/g,'').replace(/^[^；]+；\s*/,'').trim();if(!s||s==='—')return'—';return s.split('/').map(part).join('＋')}
function show(t){p.innerHTML='<b>lemma：</b><span dir="rtl">'+(t.dataset.l||'—')+'</span><br><b>品詞：</b>'+(t.dataset.p||'—')+'<br><b>形態：</b>'+morph(t.dataset.m||'');p.classList.add('open');requestAnimationFrame(()=>{const r=t.getBoundingClientRect(),q=p.getBoundingClientRect();let x=Math.max(8,Math.min(r.left+r.width/2-q.width/2,innerWidth-q.width-8)),y=r.bottom+8;if(y+q.height>innerHeight-8)y=r.top-q.height-8;p.style.left=x+'px';p.style.top=Math.max(8,y)+'px'})}
async function init(){if(!/^(5[3-9]|6[0-7])$/.test(v||'')){host.innerHTML='<div class="err">節番号が不正です。</div>';return}const src=v==='59'?'genesis-24-59-r2.html':'genesis-24-'+v+'.html';try{const text=await fetch(src,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.text()}),doc=new DOMParser().parseFromString(text,'text/html'),verse=doc.querySelector('.verse');if(!verse)throw Error('verse');verse.querySelectorAll('.tok').forEach(t=>{let gloss=t.dataset.g||'',w=t.parentElement&&t.parentElement.classList.contains('word')?t.parentElement:null;if(w){const g=w.querySelector(':scope > .gloss');if(!gloss&&g)gloss=g.textContent.trim();if(g)g.remove()}else{w=doc.createElement('span');w.className='word';t.replaceWith(w);w.appendChild(t)}const g=doc.createElement('span');g.className='gloss';g.textContent=gloss||'—';w.appendChild(g);t.removeAttribute('data-g')});host.appendChild(document.importNode(verse,true));document.querySelectorAll('.tok').forEach(t=>{t.addEventListener('mouseenter',()=>show(t));t.addEventListener('mouseleave',()=>p.classList.remove('open'));t.addEventListener('focus',()=>show(t));t.addEventListener('click',e=>{e.stopPropagation();show(t)})})}catch(e){host.innerHTML='<div class="err">対話型ヘブライ語を読み込めませんでした。</div>'}}
document.addEventListener('click',e=>{if(!e.target.closest('.tok'))p.classList.remove('open')});addEventListener('resize',()=>p.classList.remove('open'));init();
</script></body></html>
