<!doctype html><html lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Genesis 24:67</title><style>*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#12233f;font-family:"Noto Sans Hebrew","Times New Roman",serif}body{padding:56px 12px 88px;overflow-x:hidden}.verse{direction:rtl;text-align:center;font-size:clamp(29px,6vw,49px);line-height:2.05}.tok{display:inline;cursor:pointer;border-radius:6px;padding:1px 3px;outline:none}.tok:hover,.tok:focus{background:#eef4ff}.popup{position:fixed;display:none;direction:ltr;text-align:left;width:min(330px,calc(100vw - 16px));background:#fff;color:#15243b;border:1px solid #d7dfeb;border-radius:10px;box-shadow:0 8px 28px #0003;padding:12px 14px;z-index:9999;font-family:system-ui,sans-serif;font-size:14px;line-height:1.5}.popup.open{display:block}.popup b{color:#163a70}.src{margin-top:18px;text-align:center;font:12px/1.4 system-ui,sans-serif;color:#667085}@media (pointer:coarse){.tok{padding:4px}.verse{line-height:2.2}}</style></head><body><div class="verse" aria-label="Genesis 24:67"><span class="tok" tabindex="0" data-g="来る・入る" data-l="וַיְבִאֶ֣הָ" data-p="動詞" data-m="Hiphil；MorphHB HC/Vhw3ms/Sp3fs">וַיְבִאֶ֣הָ</span> <span class="tok" tabindex="0" data-g="イサク" data-l="יִצְחָ֗ק" data-p="固有名詞" data-m="—；MorphHB HNp">יִצְחָ֗ק</span> <span class="tok" tabindex="0" data-g="天幕" data-l="הָאֹ֨הֱלָה֙" data-p="名詞" data-m="—；MorphHB HTd/Ncmsa/Sd">הָאֹ֨הֱלָה֙</span> <span class="tok" tabindex="0" data-g="サラ" data-l="שָׂרָ֣ה" data-p="固有名詞" data-m="—；MorphHB HNp">שָׂרָ֣ה</span> <span class="tok" tabindex="0" data-g="母" data-l="אִמּ֔וֹ" data-p="名詞" data-m="—；MorphHB HNcfsc/Sp3ms">אִמּ֔וֹ</span> <span class="tok" tabindex="0" data-g="取る・受け取る" data-l="וַיִּקַּ֧ח" data-p="動詞" data-m="Qal；MorphHB HC/Vqw3ms">וַיִּקַּ֧ח</span> <span class="tok" tabindex="0" data-g="目的語標識" data-l="אֶת" data-p="目的語標識" data-m="—；MorphHB HTo">אֶת</span>־<span class="tok" tabindex="0" data-g="リベ tListener('focus',()=>show(t));t.addEventListener('click',e=>{if(matchMedia('(pointer:coarse)').matches){e.stopPropagation();show(t)}})});document.addEventListener('click',e=>{if(!e.target.closest('.tok'))p.classList.remove('open')});addEventListener('resize',()=>p.classList.remove('open'));</script></body></html>
