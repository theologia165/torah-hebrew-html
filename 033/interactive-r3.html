<!doctype html><html lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>033 Interactive Hebrew</title><style>*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#12233f;font-family:"Noto Sans Hebrew","Times New Roman",serif}body{padding:34px 12px 72px;overflow-x:hidden}.verse{direction:rtl;text-align:center;font-size:clamp(29px,6vw,49px);line-height:1.45;max-width:100%;margin:0 auto}.word{display:inline-flex;flex-direction:column;align-items:center;vertical-align:top;margin:0 2px 10px}.tok{display:inline-block;cursor:pointer;border-radius:6px;padding:1px 3px;outline:none;line-height:1.25;white-space:nowrap}.tok:hover,.tok:focus{background:#eef4ff}.gloss{direction:ltr;font-family:system-ui,sans-serif;font-size:12px;line-height:1.25;color:#596579;margin-top:3px;max-width:125px;text-align:center;white-space:normal}.popup{position:fixed;display:none;direction:ltr;text-align:left;width:min(360px,calc(100vw - 16px));max-height:calc(100vh - 16px);overflow:auto;background:#fff;color:#15243b;border:1px solid #d7dfeb;border-radius:10px;box-shadow:0 8px 28px #0003;padding:12px 14px;z-index:9999;font-family:system-ui,sans-serif;font-size:14px;line-height:1.55;overflow-wrap:anywhere}.popup.open{display:block}.popup b{color:#163a70}.src{margin-top:22px;text-align:center;font:12px/1.4 system-ui,sans-serif;color:#667085}.err{direction:ltr;text-align:center;font:14px/1.6 system-ui,sans-serif;color:#8a1c1c}@media (pointer:coarse){.tok{padding:4px}.word{margin-bottom:12px}}</style></head><body><div id="host"></div><div id="p" class="popup" role="dialog"></div><div class="src">Open Scriptures Hebrew Bible / MorphHB (WLC), CC BY 4.0</div><script>
const params=new URLSearchParams(location.search),v=params.get('verse');
const allowed=new Set(Array.from({length:15},(_,i)=>String(53+i)));
const host=document.getElementById('host'),p=document.getElementById('p');
function pron(s){const m=s.match(/^Sp([123])([mfc])([spd])$/);if(!m)return null;const person={'1':'1人称','2':'2人称','3':'3人称'}[m[1]],g={'m':'男性','f':'女性','c':'共通'}[m[2]],n={'s':'単数','p':'複数','d':'双数'}[m[3]];return '接尾代名詞：'+person+'・'+g+'・'+n}
function noun(s){const m=s.match(/^N([cgp])([mfc])([spd])([acd])$/);if(!m)return null;const kind={'c':'普通名詞','g':'地名・民族名系','p':'固有名詞'}[m[1]]||'名詞',g={'m':'男性','f':'女性','c':'共通'}[m[2]],n={'s':'単数','p':'複数','d':'双数'}[m[3]],st={'a':'絶対形','c':'連語形','d':'状態不定'}[m[4]];return `${kind}：${g}・${n}・${st}`}
function verb(s){const m=s.match(/^V([qNpht])([wpi vhrc])([123]?)([mfc]?)([spd]?)$/x);return null}
function decodeVerb(s){if(!s.startsWith('V'))return null;const stemMap={q:'カル',N:'ニファル',p:'ピエル',P:'プアル',h:'ヒフィル',H:'ホファル',t:'ヒトパエル'};const formMap={w:'ワイイクトール',p:'完了形',i:'未完了形',v:'命令形',h:'コホータティブ',j:'未完了形／指示形',c:'不定詞連語形',a:'不定詞絶対形',r:'分詞'};const stem=stemMap[s[1]]||s[1],form=formMap[s[2]]||s[2];let rest=s.slice(3),parts=[`語幹：${stem}`,`形：${form}`];const pm=rest.match(/^([123])([mfc])([spd])/);if(pm){parts.push({'1':'1人称','2':'2人称','3':'3人称'}[pm[1]]);parts.push({'m':'男性','f':'女性','c':'共通'}[pm[2]]);parts.push({'s':'単数','p':'複数','d':'双数'}[pm[3]]);rest=rest.slice(3)}else{const pt=rest.match(/^([mfc])([spd])([ac]?)/);if(pt){parts.push({'m':'男性','f':'女性','c':'共通'}[pt[1]]);parts.push({'s':'単数','p':'複数','d':'双数'}[pt[2]]);if(pt[3])parts.push(pt[3]==='a'?'絶対用法':'連語用法');rest=rest.slice(pt[0].length)}}if(rest)parts.push('追加標識：'+rest);return parts.join('・')}
function decode(seg){if(!seg)return'';seg=seg.replace(/^H/,'');if(seg==='C')return'接続詞';if(seg==='R')return'前置詞';if(seg==='Rd')return'前置詞＋定冠詞';if(seg==='Td')return'定冠詞';if(seg==='Tr')return'関係詞';if(seg==='Ti')return'疑問詞';if(seg==='To')return'目的語標識';if(seg==='Tm')return'提示・談話標識';if(seg==='Np')return'固有名詞';if(seg==='Sd')return'方向を示す語尾';if(seg.startsWith('Sp'))return pron(seg)||seg;if(seg.startsWith('N'))return noun(seg)||seg;if(seg.startsWith('Pp')){const m=seg.match(/^Pp([123])([mfc])([spd])$/);return m?`人称代名詞：${{'1':'1人称','2':'2人称','3':'3人称'}[m[1]]}・${{'m':'男性','f':'女性','c':'共通'}[m[2]]}・${{'s':'単数','p':'複数','d':'双数'}[m[3]]}`:seg}if(seg.startsWith('Pd')){const m=seg.match(/^Pdx([mfc])([spd])$/);return m?`指示代名詞：${{'m':'男性','f':'女性','c':'共通'}[m[1]]}・${{'s':'単数','p':'複数','d':'双数'}[m[2]]}`:seg}if(seg.startsWith('A'))return'数詞（形態情報：'+seg.slice(1)+'）';if(seg.startsWith('V'))return decodeVerb(seg)||seg;return seg}
function jpMorph(raw){if(!raw)return'—';const cleaned=raw.replace(/MorphHB\s*/g,'').replace(/^[^；]+；\s*/,'').trim();if(!cleaned||cleaned==='—')return'—';return cleaned.split('/').map(decode).join('＋')}
function show(t){p.innerHTML='<b>lemma：</b><span dir="rtl">'+((t.dataset.l||'—').replace(/</g,'&lt;'))+'</span><br><b>品詞：</b>'+((t.dataset.p||'—').replace(/</g,'&lt;'))+'<br><b>形態：</b>'+jpMorph(t.dataset.m||'');p.classList.add('open');requestAnimationFrame(()=>{const r=t.getBoundingClientRect(),q=p.getBoundingClientRect(),g=8,m=8;let x=r.left+r.width/2-q.width/2;x=Math.max(m,Math.min(x,innerWidth-q.width-m));let y=r.bottom+g;if(y+q.height>innerHeight-m)y=r.top-q.height-g;y=Math.max(m,Math.min(y,innerHeight-q.height-m));p.style.left=x+'px';p.style.top=y+'px'})}
async function init(){if(!allowed.has(v)){host.innerHTML='<div class="err">節番号が不正です。</div>';return}const src=v==='59'?'genesis-24-59-r2.html':`genesis-24-${v}.html`;try{const text=await fetch(src,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()});const doc=new DOMParser().parseFromString(text,'text/html'),verse=doc.querySelector('.verse');if(!verse)throw new Error('verse');verse.querySelectorAll('.tok').forEach(t=>{let gloss=t.dataset.g||'';let w=t.parentElement&&t.parentElement.classList.contains('word')?t.parentElement:null;if(w){const g=w.querySelector(':scope > .gloss');if(!gloss&&g)gloss=g.textContent.trim();if(g)g.remove()}else{w=doc.createElement('span');w.className='word';t.replaceWith(w);w.appendChild(t)}const g=doc.createElement('span');g.className='gloss';g.textContent=gloss||'—';w.appendChild(g);t.removeAttribute('data-g')});host.appendChild(document.importNode(verse,true));document.querySelectorAll('.tok').forEach(t=>{t.addEventListener('mouseenter',()=>{if(matchMedia('(pointer:fine)').matches)show(t)});t.addEventListener('mouseleave',()=>{if(matchMedia('(pointer:fine)').matches)p.classList.remove('open')});t.addEventListener('focus',()=>show(t));t.addEventListener('click',e=>{if(matchMedia('(pointer:coarse)').matches){e.stopPropagation();show(t)}})})}catch(e){host.innerHTML='<div class="err">対話型ヘブライ語を読み込めませんでした。</div>'}}
document.addEventListener('click',e=>{if(!e.target.closest('.tok'))p.classList.remove('open')});addEventListener('resize',()=>p.classList.remove('open'));init();
</script></body></html>
