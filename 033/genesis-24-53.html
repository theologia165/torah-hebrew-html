<!doctype html><html lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Genesis 24:53</title><style>*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#12233f;font-family:"Noto Sans Hebrew","Times New Roman",serif}body{padding:56px 12px 88px;overflow-x:hidden}.verse{direction:rtl;text-align:center;font-size:clamp(29px,6vw,49px);line-height:2.05}.tok{display:inline;cursor:pointer;border-radius:6px;padding:1px 3px;outline:none}.tok:hover,.tok:focus{background:#eef4ff}.popup{position:fixed;display:none;direction:ltr;text-align:left;width:min(330px,calc(100vw - 16px));background:#fff;color:#15243b;border:1px solid #d7dfeb;border-radius:10px;box-shadow:0 8px 28px #0003;padding:12px 14px;z-index:9999;font-family:system-ui,sans-serif;font-size:14px;line-height:1.5}.popup.open{display:block}.popup b{color:#163a70}.src{margin-top:18px;text-align:center;font:12px/1.4 system-ui,sans-serif;color:#667085}@media (pointer:coarse){.tok{padding:4px}.verse{line-height:2.2}}</style></head><body><div class="verse" aria-label="Genesis 24:53"><span class="tok" tabindex="0" data-g="出る・取り出す" data-l="וַיּוֹצֵ֨א" data-p="動詞" data-m="Hiphil；MorphHB HC/Vhw3ms">וַיּוֹצֵ֨א</span> <span class="tok" tabindex="0" data-g="僕・しもべ" data-l="הָעֶ֜בֶד" data-p="名詞" data-m="—；MorphHB HTd/Ncmsa">הָעֶ֜בֶד</span> <span class="tok" tabindex="0" data-g="器・品" data-l="כְּלֵי" data-p="名詞" data-m="—；MorphHB HNcmpc">כְּלֵי</span>־<span class="tok" tabindex="0" data-g="銀" data-l="כֶ֨סֶף" data-p="名詞" data-m="—；MorphHB HNcmsa">כֶ֨סֶף</span> <span class="tok" tabindex="0" data-g="器・品" data-l="וּכְלֵ֤י" data-p="名詞" data-m="—；MorphHB HC/Ncmpc">וּכְלֵ֤י</span> <span class="tok" tabindex="0" data-g="金" data-l="זָהָב֙" data-p="名詞" data-m="—；MorphHB HNcmsa">זָהָב֙</span> <span class="tok" tabindex="0" data-g="衣服" data-l="וּבְגָדִ֔ים" data-p="名詞" data-m="—；MorphHB HC/Ncmpa">וּבְגָדִ֔ים</span> <span class="tok" tabindex="0" data-g="与える" data-l="וַיִּתֵּ֖ן" data-p="動詞" data-m="Qal；MorphHB HC/Vqw3ms">וַיִּתֵּ֖ן</span> <span class="tok" tabindex="0" data-g="リベカ" data-l="לְרִבְקָ֑ה" data-p="固有名詞" data-m="—；MorphHB HR/Np">לְרִבְקָ֑ה</span> <span class="tok" tabindex="0" data-g="貴重な品" data-l="וּמִ֨גְדָּנֹ֔ת" data-p="名詞" data-m="—；MorphHB HC/Ncfpa">וּמִ֨גְדָּנֹ֔ת</span> <span class="tok" tabindex="0" data-g="与える" data-l="נָתַ֥ן" data-p="動詞" data-m="Qal；MorphHB HVqp3ms">נָתַ֥ן</span> <span class="tok" tabindex="0" data-g="兄弟" data-l="לְאָחִ֖יהָ" data-p="名詞" data-m="—；MorphHB HR/Ncmsc/Sp3fs">לְאָחִ֖יהָ</span> <span class="tok" tabindex="0" data-g="母" data-l="וּלְאִמָּֽהּ" data-p="名詞" data-m="—；MorphHB HC/R/Ncfsc/Sp3fs">וּלְאִמָּֽהּ</span>׃</div><div id="p" class="popup" role="dialog"></div><div class="src">Open Scriptures Hebrew Bible / MorphHB (WLC), CC BY 4.0</div><script>const p=document.getElementById('p');function show(t){p.innerHTML='<b>逐語訳：</b>'+t.dataset.g+'<br><b>lemma：</b><span dir="rtl">'+t.dataset.l+'</span><br><b>品詞：</b>'+t.dataset.p+'<br><b>形態：</b>'+t.dataset.m;p.classList.add('open');requestAnimationFrame(()=>{const r=t.getBoundingClientRect(),q=p.getBoundingClientRect(),g=8,m=8;let x=r.left+r.width/2-q.width/2;x=Math.max(m,Math.min(x,innerWidth-q.width-m));let y=r.bottom+g;if(y+q.height>innerHeight-m)y=r.top-q.height-g;y=Math.max(m,Math.min(y,innerHeight-q.height-m));p.style.left=x+'px';p.style.top=y+'px'})}document.querySelectorAll('.tok').forEach(t=>{t.addEventListener('mouseenter',()=>{if(matchMedia('(pointer:fine)').matches)show(t)});t.addEventListener('mouseleave',()=>{if(matchMedia('(pointer:fine)').matches)p.classList.remove('open')});t.addEventListener('focus',()=>show(t));t.addEventListener('click',e=>{if(matchMedia('(pointer:coarse)').matches){e.stopPropagation();show(t)}})});document.addEventListener('click',e=>{if(!e.target.closest('.tok'))p.classList.remove('open')});addEventListener('resize',()=>p.classList.remove('open'));</script></body></html>
