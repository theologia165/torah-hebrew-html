<!doctype html><html lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Genesis 24:54</title><style>*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#12233f;font-family:"Noto Sans Hebrew","Times New Roman",serif}body{padding:56px 12px 88px;overflow-x:hidden}.verse{direction:rtl;text-align:center;font-size:clamp(29px,6vw,49px);line-height:2.05}.tok{display:inline;cursor:pointer;border-radius:6px;padding:1px 3px;outline:none}.tok:hover,.tok:focus{background:#eef4ff}.popup{position:fixed;display:none;direction:ltr;text-align:left;width:min(330px,calc(100vw - 16px));background:#fff;color:#15243b;border:1px solid #d7dfeb;border-radius:10px;box-shadow:0 8px 28px #0003;padding:12px 14px;z-index:9999;font-family:system-ui,sans-serif;font-size:14px;line-height:1.5}.popup.open{display:block}.popup b{color:#163a70}.src{margin-top:18px;text-align:center;font:12px/1.4 system-ui,sans-serif;color:#667085}@media (pointer:coarse){.tok{padding:4px}.verse{line-height:2.2}}</style></head><body><div class="verse" aria-label="Genesis 24:54"><span class="tok" tabindex="0" data-g="食べる" data-l="וַיֹּאכְל֣וּ" data-p="動詞" data-m="Qal；MorphHB HC/Vqw3mp">וַיֹּאכְל֣וּ</span> <span class="tok" tabindex="0" data-g="飲む" data-l="וַיִּשְׁתּ֗וּ" data-p="動詞" data-m="Qal；MorphHB HC/Vqw3mp">וַיִּשְׁתּ֗וּ</span> <span class="tok" tabindex="0" data-g="彼" data-l="ה֛וּא" data-p="代名詞" data-m="—；MorphHB HPp3ms">ה֛וּא</span> <span class="tok" tabindex="0" data-g="人・男" data-l="וְהָאֲנָשִׁ֥ים" data-p="名詞" data-m="—；MorphHB HC/Td/Ncmpa">וְהָאֲנָשִׁ֥ים</span> <span class="tok" tabindex="0" data-g="〜するところの" data-l="אֲשֶׁר" data-p="関係詞" data-m="—；MorphHB HTr">אֲשֶׁר</span>־<span class="tok" tabindex="0" data-g="〜と共に" data-l="עִמּ֖וֹ" data-p="前置詞" data-m="—；MorphHB HR/Sp3ms">עִמּ֖וֹ</span> <span class="tok" tabindex="0" data-g="泊まる" data-l="וַיָּלִ֑ינוּ" data-p="動詞" data-m="Qal；MorphHB HC/Vqw3mp">וַיָּלִ֑ינוּ</span> <span class="tok" tabindex="0" data-g="立つ・起きる" data-l="וַיָּק֣וּמוּ" data-p="動詞" data-m="Qal；MorphHB HC/Vqw3mp">וַיָּק֣וּמוּ</span> <span class="tok" tabindex="0" data-g="朝" data-l="בַבֹּ֔קֶר" data-p="名詞" data-m="—；MorphHB HRd/Ncmsa">בַבֹּ֔קֶר</span> <span class="tok" tabindex="0" data-g="言う" data-l="וַיֹּ֖אמֶר" data-p="動詞" data-m="Qal；MorphHB HC/Vqw3ms">וַיֹּ֖אמֶר</span> <span class="tok" tabindex="0" data-g="送り出す" data-l="שַׁלְּחֻ֥נִי" data-p="動詞" data-m="Piel；MorphHB HVpv2mp/Sp1cs">שַׁלְּחֻ֥נִי</span> <span class="tok" tabindex="0" data-g="主人" data-l="לַֽאדֹנִֽי" data-p="名詞" data-m="—；MorphHB HR/Ncmsc/Sp1cs">לַֽאדֹנִֽי</span>׃</div><div id="p" class="popup" role="dialog"></div><div class="src">Open Scriptures Hebrew Bible / MorphHB (WLC), CC BY 4.0</div><script>const p=document.getElementById('p');function show(t){p.innerHTML='<b>逐語訳：</b>'+t.dataset.g+'<br><b>lemma：</b><span dir="rtl">'+t.dataset.l+'</span><br><b>品詞：</b>'+t.dataset.p+'<br><b>形態：</b>'+t.dataset.m;p.classList.add('open');requestAnimationFrame(()=>{const r=t.getBoundingClientRect(),q=p.getBoundingClientRect(),g=8,m=8;let x=r.left+r.width/2-q.width/2;x=Math.max(m,Math.min(x,innerWidth-q.width-m));let y=r.bottom+g;if(y+q.height>innerHeight-m)y=r.top-q.height-g;y=Math.max(m,Math.min(y,innerHeight-q.height-m));p.style.left=x+'px';p.style.top=y+'px'})}document.querySelectorAll('.tok').forEach(t=>{t.addEventListener('mouseenter',()=>{if(matchMedia('(pointer:fine)').matches)show(t)});t.addEventListener('mouseleave',()=>{if(matchMedia('(pointer:fine)').matches)p.classList.remove('open')});t.addEventListener('focus',()=>show(t));t.addEventListener('click',e=>{if(matchMedia('(pointer:coarse)').matches){e.stopPropagation();show(t)}})});document.addEventListener('click',e=>{if(!e.target.closest('.tok'))p.classList.remove('open')});addEventListener('resize',()=>p.classList.remove('open'));</script></body></html>
