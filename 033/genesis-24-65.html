<!doctype html><html lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Genesis 24:65</title><style>*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#12233f;font-family:"Noto Sans Hebrew","Times New Roman",serif}body{padding:56px 12px 88px;overflow-x:hidden}.verse{direction:rtl;text-align:center;font-size:clamp(29px,6vw,49px);line-height:2.05}.tok{display:inline;cursor:pointer;border-radius:6px;padding:1px 3px;outline:none}.tok:hover,.tok:focus{background:#eef4ff}.popup{position:fixed;display:none;direction:ltr;text-align:left;width:min(330px,calc(100vw - 16px));background:#fff;color:#15243b;border:1px solid #d7dfeb;border-radius:10px;box-shadow:0 8px 28px #0003;padding:12px 14px;z-index:9999;font-family:system-ui,sans-serif;font-size:14px;line-height:1.5}.popup.open{display:block}.popup b{color:#163a70}.src{margin-top:18px;text-align:center;font:12px/1.4 system-ui,sans-serif;color:#667085}@media (pointer:coarse){.tok{padding:4px}.verse{line-height:2.2}}</style></head><body><div class="verse" aria-label="Genesis 24:65"><span class="tok" tabindex="0" data-g="言う" data-l="וַתֹּ֣אמֶר" data-p="動詞" data-m="Qal；MorphHB HC/Vqw3fs">וַתֹּ֣אמֶר</span> <span class="tok" tabindex="0" data-g="〜へ" data-l="אֶל" data-p="前置詞" data-m="—；MorphHB HR">אֶל</span>־<span class="tok" tabindex="0" data-g="僕・しもべ" data-l="הָעֶ֗בֶד" data-p="名詞" data-m="—；MorphHB HTd/Ncmsa">הָעֶ֗בֶד</span> <span class="tok" tabindex="0" data-g="だれ" data-l="מִֽי" data-p="疑問詞" data-m="—；MorphHB HTi">מִֽי</span>־<span class="tok" tabindex="0" data-g="人・男" data-l="הָאִ֤ישׁ" data-p="名詞" data-m="—；MorphHB HTd/Ncmsa">הָאִ֤ישׁ</span> <span class="tok" tabindex="0" data-g="あの" data-l="הַלָּזֶה֙" data-p="代名詞" data-m="—；MorphHB HPdxms">הַלָּזֶה֙</span> <span class="tok" tabindex="0" data-g="歩く・行く" data-l="הַהֹלֵ֤ךְ" data-p="動詞" data-m="Qal；MorphHB HTd/Vqrmsa">הַהֹלֵ֤ךְ</span> <span class="tok" tabindex="0" data-g="野・畑" data-l="בַּשָּׂדֶה֙" data-p=" ('focus',()=>show(t));t.addEventListener('click',e=>{if(matchMedia('(pointer:coarse)').matches){e.stopPropagation();show(t)}})});document.addEventListener('click',e=>{if(!e.target.closest('.tok'))p.classList.remove('open')});addEventListener('resize',()=>p.classList.remove('open'));</script></body></html>
