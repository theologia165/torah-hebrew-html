<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Genesis 32:8</title><style>*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#12233f;font-family:"Noto Sans Hebrew","Times New Roman",serif}
body{padding:50px 12px 86px;overflow-x:hidden}.verse{direction:rtl;text-align:center;font-size:clamp(27px,5.5vw,47px);line-height:1.55}
.word{display:inline-flex;flex-direction:column;align-items:center;vertical-align:top;margin:.08em .04em .28em}.tok{display:inline-block;cursor:pointer;border-radius:7px;padding:1px 4px;outline:none;transition:background-color .12s ease,box-shadow .12s ease}
.tok:hover,.tok:focus,.tok.active{background:#dbeafe;box-shadow:0 0 0 1px #93c5fd}.gloss{direction:ltr;font:500 clamp(11px,2.2vw,15px)/1.25 system-ui,sans-serif;color:#34445f;white-space:nowrap;margin-top:2px}
.sep{display:inline-block;vertical-align:top}.popup{position:fixed;display:none;direction:ltr;text-align:left;width:min(350px,calc(100vw - 16px));max-height:calc(100vh - 16px);overflow:auto;background:#fff;color:#15243b;border:1px solid #cbd5e1;border-radius:11px;box-shadow:0 10px 30px #0003;padding:13px 15px;z-index:9999;font:14px/1.55 system-ui,sans-serif}.popup.open{display:block}.popup b{color:#163a70}.popup [dir=rtl]{font-size:18px}.src{margin-top:20px;text-align:center;font:12px/1.4 system-ui,sans-serif;color:#667085}@media(pointer:coarse){.tok{padding:4px 6px}.verse{line-height:1.7}}</style></head><body><div class="verse" aria-label="Genesis 32:8" data-wlc="וַיִּירָ֧א יַעֲקֹ֛ב מְאֹ֖ד וַיֵּ֣צֶר ל֑וֹ וַיַּ֜חַץ אֶת־הָעָ֣ם אֲשֶׁר־אִתּ֗וֹ וְאֶת־הַצֹּ֧אן וְאֶת־הַבָּקָ֛ר וְהַגְּמַלִּ֖ים לִשְׁנֵ֥י מַחֲנֽוֹת׃"><span class="word"><span class="tok" tabindex="0" data-lemma="יָרֵא" data-pos="動詞" data-morph="接続詞／動詞・語幹：Qal・形：wayyiqtol・3人称・男性・単数" data-morph-code="HC/Vqw3ms">וַיִּירָ֧א</span><span class="gloss">そして恐れた</span></span><span class="sep" aria-hidden="true"> </span><span class="word"><span class="tok" tabindex="0" data-lemma="יַעֲקֹב" data-pos="固有名詞" data-morph="固有名詞" data-morph-code="HNp">יַעֲקֹ֛ב</span><span class="gloss">ヤコブは</span></span><span class="sep" aria-hidden="true"> </span><span class="word"><span class="tok" tabindex="0" data-lemma="מְאֹד" data-pos="副詞" data-morph="副詞" data-morph-code="HD">מְאֹ֖ד</span><span class="gloss">非常に</span></span><span class="sep" aria-hidden="true"> </span><span class="word"><span class="tok" tabindex="0" data-lemma="יָצַר" data-pos="動詞" data-morph="接続詞／動詞・語幹：Qal・形：wayyiqtol・3人称・男性・単数" data-morph-code="HC/Vqw3ms">וַיֵּ֣צֶר</span><span class="gloss">そして苦しんだ</span></span><span class="sep" aria-hidden="true"> </span><span class="word"><span class="tok" tabindex="0" data-lemma="לְ" data-pos="前置詞" data-morph="前置詞／人称代名詞接尾辞・3人称・男性・単数" data-morph-code="HR/Sp3ms">ל֑וֹ</span><span class="gloss">彼は</span></span><span class="sep" aria-hidden="true"> </span><span class="word"><span class="tok" tabindex="0" data-lemma="חָצָה" data-pos="動詞" data-morph="接続詞／動詞・語幹：Qal・形：wayyiqtol・3人称・男性・単数" data-morph-code="HC/Vqw3ms">וַיַּ֜חַץ</span><span class="gloss">そして分けた</span></span><span class="sep" aria-hidden="true"> </span><span class="word"><span class="tok" tabindex="0" data-lemma="אֵת" data-pos="対格標識" data-morph="対格標識" data-morph-code="HTo">אֶת</span><span class="gloss">〜を</span></span><span class="sep" aria-hidden="true">־</span><span class="word"><span class="tok" tabindex="0" data-lemma="עַם" data-pos="名詞" data-morph="定冠詞／名詞・男性・単数・絶対形" data-morph-code="HTd/Ncmsa">הָעָ֣ם</span><span class="gloss">その民</span></span><span class="sep" aria-hidden="true"> </span><span class="word"><span class="tok" tabindex="0" data-lemma="אֲשֶׁר" data-pos="関係詞" data-morph="関係詞" data-morph-code="HTr">אֲשֶׁר</span><span class="gloss">〜である</span></span><span class="sep" aria-hidden="true">־</span><span class="word"><span class="tok" tabindex="0" data-lemma="אֵת" data-pos="前置詞" data-morph="前置詞／人称代名詞接尾辞・3人称・男性・単数" data-morph-code="HR/Sp3ms">אִתּ֗וֹ</span><span class="gloss">彼と共に</span></span><span class="sep" aria-hidden="true"> </span><span class="word"><span class="tok" tabindex="0" data-lemma="אֵת" data-pos="対格標識" data-morph="接続詞／対格標識" data-morph-code="HC/To">וְאֶת</span><span class="gloss">そして〜を</span></span><span class="sep" aria-hidden="true">־</span><span class="word"><span class="tok" tabindex="0" data-lemma="צֹאן" data-pos="名詞" data-morph="定冠詞／名詞・両性・単数・絶対形" data-morph-code="HTd/Ncbsa">הַצֹּ֧אן</span><span class="gloss">羊の群れ</span></span><span class="sep" aria-hidden="true"> </span><span class="word"><span class="tok" tabindex="0" data-lemma="אֵת" data-pos="対格標識" data-morph="接続詞／対格標識" data-morph-code="HC/To">וְאֶת</span><span class="gloss">そして〜を</span></span><span class="sep" aria-hidden="true">־</span><span class="word"><span class="tok" tabindex="0" data-lemma="בָּקָר" data-pos="名詞" data-morph="定冠詞／名詞・両性・単数・絶対形" data-morph-code="HTd/Ncbsa">הַבָּקָ֛ר</span><span class="gloss">牛の群れ</span></span><span class="sep" aria-hidden="true"> </span><span class="word"><span class="tok" tabindex="0" data-lemma="גָּמָל" data-pos="名詞" data-morph="接続詞／定冠詞／名詞・男性・複数・絶対形" data-morph-code="HC/Td/Ncmpa">וְהַגְּמַלִּ֖ים</span><span class="gloss">そしてらくだたち</span></span><span class="sep" aria-hidden="true"> </span><span class="word"><span class="tok" tabindex="0" data-lemma="שְׁנַיִם" data-pos="数詞" data-morph="前置詞／基数詞・男性・双数・連語形" data-morph-code="HR/Acmdc">לִשְׁנֵ֥י</span><span class="gloss">二つの</span></span><span class="sep" aria-hidden="true"> </span><span class="word"><span class="tok" tabindex="0" data-lemma="מַחֲנֶה" data-pos="名詞" data-morph="名詞・両性・複数・絶対形" data-morph-code="HNcbpa">מַחֲנֽוֹת</span><span class="gloss">陣営に</span></span><span class="sep" aria-hidden="true">׃</span></div><div id="popup" class="popup" role="dialog" aria-live="polite"></div><div class="src">Open Scriptures Hebrew Bible / MorphHB (WLC), CC BY 4.0</div><script>const popup=document.getElementById('popup');let active=null;
function closePopup(){popup.classList.remove('open');if(active)active.classList.remove('active');active=null}
function showPopup(token){if(active&&active!==token)active.classList.remove('active');active=token;token.classList.add('active');popup.innerHTML='<b>lemma：</b><span dir="rtl">'+token.dataset.lemma+'</span><br><b>品詞：</b>'+token.dataset.pos+'<br><b>形態：</b>'+token.dataset.morph;popup.classList.add('open');requestAnimationFrame(()=>{const r=token.getBoundingClientRect(),p=popup.getBoundingClientRect(),gap=8,margin=8;let left=r.left+r.width/2-p.width/2;left=Math.max(margin,Math.min(left,innerWidth-p.width-margin));let top=r.bottom+gap;if(top+p.height>innerHeight-margin)top=r.top-p.height-gap;top=Math.max(margin,Math.min(top,innerHeight-p.height-margin));popup.style.left=left+'px';popup.style.top=top+'px'})}
document.querySelectorAll('.tok').forEach(token=>{token.addEventListener('mouseenter',()=>{if(matchMedia('(pointer:fine)').matches)showPopup(token)});token.addEventListener('mouseleave',()=>{if(matchMedia('(pointer:fine)').matches&&!token.matches(':focus'))closePopup()});token.addEventListener('focus',()=>showPopup(token));token.addEventListener('blur',()=>{if(matchMedia('(pointer:fine)').matches)closePopup()});token.addEventListener('click',event=>{event.stopPropagation();showPopup(token)})});document.addEventListener('click',closePopup);addEventListener('resize',closePopup);addEventListener('scroll',closePopup,{passive:true});</script></body></html>
