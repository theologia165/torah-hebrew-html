<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Genesis 32:6</title><style>*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#12233f;font-family:"Noto Sans Hebrew","Times New Roman",serif}
body{padding:50px 12px 86px;overflow-x:hidden}.verse{direction:rtl;text-align:center;font-size:clamp(27px,5.5vw,47px);line-height:1.55}
.word{display:inline-flex;flex-direction:column;align-items:center;vertical-align:top;margin:.08em .04em .28em}.tok{display:inline-block;cursor:pointer;border-radius:7px;padding:1px 4px;outline:none;transition:background-color .12s ease,box-shadow .12s ease}
.tok:hover,.tok:focus,.tok.active{background:#dbeafe;box-shadow:0 0 0 1px #93c5fd}.gloss{direction:ltr;font:500 clamp(11px,2.2vw,15px)/1.25 system-ui,sans-serif;color:#34445f;white-space:nowrap;margin-top:2px}
.sep{display:inline-block;vertical-align:top}.popup{position:fixed;display:none;direction:ltr;text-align:left;width:min(350px,calc(100vw - 16px));max-height:calc(100vh - 16px);overflow:auto;background:#fff;color:#15243b;border:1px solid #cbd5e1;border-radius:11px;box-shadow:0 10px 30px #0003;padding:13px 15px;z-index:9999;font:14px/1.55 system-ui,sans-serif}.popup.open{display:block}.popup b{color:#163a70}.popup [dir=rtl]{font-size:18px}.src{margin-top:20px;text-align:center;font:12px/1.4 system-ui,sans-serif;color:#667085}@media(pointer:coarse){.tok{padding:4px 6px}.verse{line-height:1.7}}</style></head><body><div class="verse" aria-label="Genesis 32:6" data-wlc="וַֽיְהִי־לִי֙ שׁ֣וֹר וַחֲמ֔וֹר צֹ֖אן וְעֶ֣בֶד וְשִׁפְחָ֑ה וָֽאֶשְׁלְחָה֙ לְהַגִּ֣יד לַֽאדֹנִ֔י לִמְצֹא־חֵ֖ן בְּעֵינֶֽיךָ׃"><span class="word"><span class="tok" tabindex="0" data-lemma="הָיָה" data-pos="動詞" data-morph="接続詞／動詞・語幹：Qal・形：wayyiqtol・3人称・男性・単数" data-morph-code="HC/Vqw3ms">וַֽיְהִי</span><span class="gloss">そしてあった</span></span><span class="sep" aria-hidden="true">־</span><span class="word"><span class="tok" tabindex="0" data-lemma="לְ" data-pos="前置詞" data-morph="前置詞／人称代名詞接尾辞・1人称・共通・単数" data-morph-code="HR/Sp1cs">לִי֙</span><span class="gloss">私に</span></span><span class="sep" aria-hidden="true"> </span><span class="word"><span class="tok" tabindex="0" data-lemma="שׁוֹר" data-pos="名詞" data-morph="名詞・男性・単数・絶対形" data-morph-code="HNcmsa">שׁ֣וֹר</span><span class="gloss">牛</span></span><span class="sep" aria-hidden="true"> </span><span class="word"><span class="tok" tabindex="0" data-lemma="חֲמוֹר" data-pos="名詞" data-morph="接続詞／名詞・両性・単数・絶対形" data-morph-code="HC/Ncbsa">וַחֲמ֔וֹר</span><span class="gloss">そしてろば</span></span><span class="sep" aria-hidden="true"> </span><span class="word"><span class="tok" tabindex="0" data-lemma="צֹאן" data-pos="名詞" data-morph="名詞・両性・単数・絶対形" data-morph-code="HNcbsa">צֹ֖אן</span><span class="gloss">羊の群れ</span></span><span class="sep" aria-hidden="true"> </span><span class="word"><span class="tok" tabindex="0" data-lemma="עֶבֶד" data-pos="名詞" data-morph="接続詞／名詞・男性・単数・絶対形" data-morph-code="HC/Ncmsa">וְעֶ֣בֶד</span><span class="gloss">そして男奴隷</span></span><span class="sep" aria-hidden="true"> </span><span class="word"><span class="tok" tabindex="0" data-lemma="שִׁפְחָה" data-pos="名詞" data-morph="接続詞／名詞・女性・単数・絶対形" data-morph-code="HC/Ncfsa">וְשִׁפְחָ֑ה</span><span class="gloss">そして女奴隷</span></span><span class="sep" aria-hidden="true"> </span><span class="word"><span class="tok" tabindex="0" data-lemma="שָׁלַח" data-pos="動詞" data-morph="接続詞／動詞・語幹：Qal・形：wayyiqtol・1人称・共通・単数／方向/強意の ה 接尾辞" data-morph-code="HC/Vqw1cs/Sh">וָֽאֶשְׁלְחָה֙</span><span class="gloss">そして私は遣わした</span></span><span class="sep" aria-hidden="true"> </span><span class="word"><span class="tok" tabindex="0" data-lemma="נָגַד" data-pos="動詞" data-morph="前置詞／動詞・語幹：Hiphil・形：不定詞連語形" data-morph-code="HR/Vhc">לְהַגִּ֣יד</span><span class="gloss">告げるために</span></span><span class="sep" aria-hidden="true"> </span><span class="word"><span class="tok" tabindex="0" data-lemma="אָדוֹן" data-pos="名詞" data-morph="前置詞／名詞・男性・単数・連語形／人称代名詞接尾辞・1人称・共通・単数" data-morph-code="HR/Ncmsc/Sp1cs">לַֽאדֹנִ֔י</span><span class="gloss">私の主人に</span></span><span class="sep" aria-hidden="true"> </span><span class="word"><span class="tok" tabindex="0" data-lemma="מָצָא" data-pos="動詞" data-morph="前置詞／動詞・語幹：Qal・形：不定詞連語形" data-morph-code="HR/Vqc">לִמְצֹא</span><span class="gloss">見いだすために</span></span><span class="sep" aria-hidden="true">־</span><span class="word"><span class="tok" tabindex="0" data-lemma="חֵן" data-pos="名詞" data-morph="名詞・男性・単数・絶対形" data-morph-code="HNcmsa">חֵ֖ן</span><span class="gloss">好意を</span></span><span class="sep" aria-hidden="true"> </span><span class="word"><span class="tok" tabindex="0" data-lemma="עַיִן" data-pos="名詞" data-morph="前置詞／名詞・両性・双数・連語形／人称代名詞接尾辞・2人称・男性・単数" data-morph-code="HR/Ncbdc/Sp2ms">בְּעֵינֶֽיךָ</span><span class="gloss">あなたの目に</span></span><span class="sep" aria-hidden="true">׃</span></div><div id="popup" class="popup" role="dialog" aria-live="polite"></div><div class="src">Open Scriptures Hebrew Bible / MorphHB (WLC), CC BY 4.0</div><script>const popup=document.getElementById('popup');let active=null;
function closePopup(){popup.classList.remove('open');if(active)active.classList.remove('active');active=null}
function showPopup(token){if(active&&active!==token)active.classList.remove('active');active=token;token.classList.add('active');popup.innerHTML='<b>lemma：</b><span dir="rtl">'+token.dataset.lemma+'</span><br><b>品詞：</b>'+token.dataset.pos+'<br><b>形態：</b>'+token.dataset.morph;popup.classList.add('open');requestAnimationFrame(()=>{const r=token.getBoundingClientRect(),p=popup.getBoundingClientRect(),gap=8,margin=8;let left=r.left+r.width/2-p.width/2;left=Math.max(margin,Math.min(left,innerWidth-p.width-margin));let top=r.bottom+gap;if(top+p.height>innerHeight-margin)top=r.top-p.height-gap;top=Math.max(margin,Math.min(top,innerHeight-p.height-margin));popup.style.left=left+'px';popup.style.top=top+'px'})}
document.querySelectorAll('.tok').forEach(token=>{token.addEventListener('mouseenter',()=>{if(matchMedia('(pointer:fine)').matches)showPopup(token)});token.addEventListener('mouseleave',()=>{if(matchMedia('(pointer:fine)').matches&&!token.matches(':focus'))closePopup()});token.addEventListener('focus',()=>showPopup(token));token.addEventListener('blur',()=>{if(matchMedia('(pointer:fine)').matches)closePopup()});token.addEventListener('click',event=>{event.stopPropagation();showPopup(token)})});document.addEventListener('click',closePopup);addEventListener('resize',closePopup);addEventListener('scroll',closePopup,{passive:true});</script></body></html>
