<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>創世記32:4｜対話型ヘブライ語</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="wrap">
  <section class="hebrew-card">
    <div id="verse" class="verse" dir="rtl" aria-label="創世記32章4節ヘブライ語"></div>
    <p class="hint">PC：語にマウスを重ねると分解情報を表示。右クリックでGenesis内を検索します。スマホ：タップで分解情報を表示します。</p>
    <div id="status" class="status">本文を読み込み中…</div>
  </section>

  <section id="resultsCard" class="results-card" hidden>
    <div class="results-head">
      <strong id="resultsTitle">検索結果</strong>
      <button id="closeResults" type="button">閉じる</button>
    </div>
    <div id="resultsMeta" class="meta"></div>
    <div id="results"></div>
  </section>
</main>
<div id="hover" class="hover" hidden></div>
<script src="./app.js"></script>
</body>
</html>
