<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Genesis 25:10</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#12233f;font-family:"Noto Sans Hebrew","Times New Roman",serif}
body{padding:50px 12px 86px;overflow-x:hidden}.verse{direction:rtl;text-align:center;font-size:clamp(27px,5.5vw,47px);line-height:1.55}
.word{display:inline-flex;flex-direction:column;align-items:center;vertical-align:top;margin:.08em .04em .28em}.tok{display:inline-block;cursor:pointer;border-radius:7px;padding:1px 4px;outline:none;transition:background-color .12s ease,box-shadow .12s ease}
.tok:hover,.tok:focus,.tok.active{background:#dbeafe;box-shadow:0 0 0 1px #93c5fd}.gloss{direction:ltr;font:500 clamp(11px,2.2vw,15px)/1.25 system-ui,sans-serif;color:#34445f;white-space:nowrap;margin-top:2px}
.punct{display:inline-block;vertical-align:top}.popup{position:fixed;display:none;direction:ltr;text-align:left;width:min(350px,calc(100vw - 16px));max-height:calc(100vh - 16px);overflow:auto;background:#fff;color:#15243b;border:1px solid #cbd5e1;border-radius:11px;box-shadow:0 10px 30px #0003;padding:13px 15px;z-index:9999;font:14px/1.55 system-ui,sans-serif}.popup.open{display:block}.popup b{color:#163a70}.popup [dir=rtl]{font-size:18px}.src{margin-top:20px;text-align:center;font:12px/1.4 system-ui,sans-serif;color:#667085}@media(pointer:coarse){.tok{padding:4px 6px}.verse{line-height:1.7}}
</style></head><body><div class="verse" aria-label="Genesis 25:10"><span class="word"><span class="tok" tabindex="0" data-lemma="הַשָּׂדֶ֛ה" data-pos="名詞" data-morph="定冠詞を伴う">הַשָּׂדֶ֛ה</span><span class="gloss">その畑</span></span> <span class="word"><span class="tok" tabindex="0" data-lemma="אֲשֶׁר" data-pos="関係詞" data-morph="関係を示す不変化詞">אֲשֶׁר</span><span class="gloss">〜するところの</span></span>־<span class="word"><span class="tok" tabindex="0" data-lemma="קָנָ֥ה" data-pos="動詞" data-morph="語幹：カル・形：完了形・3人称・男性・単数">קָנָ֥ה</span><span class="gloss">買い取った</span></span> <span class="word"><span class="tok" tabindex="0" data-lemma="אַבְרָהָ֖ם" data-pos="固有名詞" data-morph="固有名詞">אַבְרָהָ֖ם</span><span class="gloss">アブラハムが</span></span> <span class="word"><span class="tok" tabindex="0" data-lemma="מֵאֵ֣ת" data-pos="前置詞" data-morph="前置詞として用いられる不変化詞">מֵאֵ֣ת</span><span class="gloss">〜から</span></span> <span class="word"><span class="tok" tabindex="0" data-lemma="בְּנֵי" data-pos="名詞" data-morph="文脈上の機能を担う不変化詞">בְּנֵי</span><span class="gloss">子ら</span></span>־<span class="word"><span class="tok" tabindex="0" data-lemma="חֵ֑ת" data-pos="固有名詞" data-morph="固有名詞">חֵ֑ת</span><span class="gloss">ヘトの</span></span> <span class="word"><span class="tok" tabindex="0" data-lemma="שָׁ֛מָּה" data-pos="副詞" data-morph="方向を示す語尾">שָׁ֛מָּה</span><span class="gloss">そこに</span></span> <span class="word"><span class="tok" tabindex="0" data-lemma="קֻבַּ֥ר" data-pos="動詞" data-morph="語幹：プアル・形：完了形・3人称・男性・単数">קֻבַּ֥ר</span><span class="gloss">葬られた</span></span> <span class="word"><span class="tok" tabindex="0" data-lemma="אַבְרָהָ֖ם" data-pos="固有名詞" data-morph="固有名詞">אַבְרָהָ֖ם</span><span class="gloss">アブラハムと</span></span> <span class="word"><span class="tok" tabindex="0" data-lemma="וְשָׂרָ֥ה" data-pos="固有名詞" data-morph="接続詞を伴う">וְשָׂרָ֥ה</span><span class="gloss">そしてサラ</span></span> <span class="word"><span class="tok" tabindex="0" data-lemma="אִשְׁתּֽוֹ" data-pos="名詞" data-morph="3人称・男性・単数・3人称男性単数の接尾辞">אִשְׁתּֽוֹ</span><span class="gloss">彼の妻</span></span>׃</div><div id="popup" class="popup" role="dialog" aria-live="polite"></div><div class="src">Open Scriptures Hebrew Bible / MorphHB (WLC), CC BY 4.0</div><script>
const popup=document.getElementById('popup');let active=null;
function closePopup(){popup.classList.remove('open');if(active)active.classList.remove('active');active=null}
function showPopup(token){if(active&&active!==token)active.classList.remove('active');active=token;token.classList.add('active');popup.innerHTML='<b>lemma：</b><span dir="rtl">'+token.dataset.lemma+'</span><br><b>品詞：</b>'+token.dataset.pos+'<br><b>形態：</b>'+token.dataset.morph;popup.classList.add('open');requestAnimationFrame(()=>{const r=token.getBoundingClientRect(),p=popup.getBoundingClientRect(),gap=8,margin=8;let left=r.left+r.width/2-p.width/2;left=Math.max(margin,Math.min(left,innerWidth-p.width-margin));let top=r.bottom+gap;if(top+p.height>innerHeight-margin)top=r.top-p.height-gap;top=Math.max(margin,Math.min(top,innerHeight-p.height-margin));popup.style.left=left+'px';popup.style.top=top+'px'})}
document.querySelectorAll('.tok').forEach(token=>{token.addEventListener('mouseenter',()=>{if(matchMedia('(pointer:fine)').matches)showPopup(token)});token.addEventListener('mouseleave',()=>{if(matchMedia('(pointer:fine)').matches&&!token.matches(':focus'))closePopup()});token.addEventListener('focus',()=>showPopup(token));token.addEventListener('blur',()=>{if(matchMedia('(pointer:fine)').matches)closePopup()});token.addEventListener('click',event=>{event.stopPropagation();showPopup(token)})});document.addEventListener('click',closePopup);addEventListener('resize',closePopup);addEventListener('scroll',closePopup,{passive:true});
</script></body></html>
